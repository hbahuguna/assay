name: Quality Harness PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-harness:
    name: Quality Harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Run quality-harness
        id: harness
        uses: ./.github/actions/quality-harness
        with:
          target: examples/sample-repo
          personas-dir: personas
          no-browser: "true"
          fail-on: high
          min-score: "0"
          comment: "true"
