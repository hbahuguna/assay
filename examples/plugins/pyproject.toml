[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-harness-sample-check"
version = "0.1.0"
description = "Example signed check plugin for quality-harness"
requires-python = ">=3.8"
dependencies = ["quality-harness"]

[project.entry-points.quality_harness.checks]
sample_check = "sample_check:PLUGIN"

[tool.setuptools]
py-modules = ["sample_check"]
